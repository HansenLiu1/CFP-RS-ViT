[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cfp-rs-vit"
version = "0.1.0"
description = "Controlled Foreground Perturbation for diagnosing semantic structure in remote-sensing vision transformers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Hanxu Liu" },
  { name = "Siyang Lai" },
]
keywords = [
  "remote sensing",
  "vision transformer",
  "representation analysis",
  "controlled perturbation",
  "reproducibility",
]
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "Pillow>=12,<13",
  "tqdm>=4.66,<5",
  "cloudpickle>=3.0,<4",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
models = [
  "open_clip_torch>=3.3,<3.4",
  "safetensors>=0.5,<0.6",
  "torch>=2.6,<2.7",
  "transformers>=4.57,<4.58",
]
figures = [
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
cfra-analysis = "cfra.analysis.cli:main"

[project.urls]
Homepage = "https://github.com/HansenLiu1/CFP-RS-ViT"
Repository = "https://github.com/HansenLiu1/CFP-RS-ViT"
Issues = "https://github.com/HansenLiu1/CFP-RS-ViT/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"src/cfra/pipeline/*" = ["E402", "E731"]
"src/cfra/paper_export*.py" = ["E701", "E702"]
"src/cfra/export_acceptance.py" = ["E701"]
"tests/*" = ["E702", "F841"]
